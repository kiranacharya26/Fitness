steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fitness-dashboard:$COMMIT_SHA
      - .
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - gcloud
      - run
      - deploy
      - fitness-dashboard
      - --image
      - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fitness-dashboard:$COMMIT_SHA
      - --region
      - asia-south1
      - --quiet
images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fitness-dashboard:$COMMIT_SHA
